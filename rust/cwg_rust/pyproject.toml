[build-system]
requires = ["maturin>=1.0,<2.0"]
build-backend = "maturin"

[project]
name = "cwg-rust"
version = "0.2.0"
description = "Rust-accelerated graph activity scoring and A* path computation for scGraphAgent"
authors = [{name = "scGraphAgent authors"}]
requires-python = ">=3.10"
license="MIT"
classifiers = [
    "Programming Language :: Rust",
    "Programming Language :: Python :: Implementation :: CPython",
]
dependencies = [
    "numpy>=1.24",
    "pandas>=2.0",
    "scipy>=1.10",
]

[tool.maturin]
module-name = "cwg_rust._cwg_rust"
python-source = "python"
